name: CI for product-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'  


      - name: Install dependencies
        run: npm ci  

      - name: Build Docker image
        run: |
          docker build \
            -t yousef2005/product-service:latest \
            -t yousef2005/product-service:${{ github.sha }} \
            -t yousef2005/product-service:1.0.${{ github.run_number }} \
            .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Push Docker image
        run: |
          docker push yousef2005/product-service:latest
          docker push yousef2005/product-service:${{ github.sha }}
          docker push yousef2005/product-service:1.0.${{ github.run_number }}
