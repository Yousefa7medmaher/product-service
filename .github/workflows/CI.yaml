name: CI for product-service

on:
  push:
    branches: [products-service]
  pull_request:
    branches: [products-service]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test
        continue-on-error: true



  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
    if: github.ref_name == 'products-service'
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v3
      - name: "Configure AWS Credentials" 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.0.0
        with:
          context: . 
          push: true
          tags: | 
            484907510239.dkr.ecr.us-east-1.amazonaws.com/product-service:latest 
            484907510239.dkr.ecr.us-east-1.amazonaws.com/product-service:v1.${{github.run_number}}
            484907510239.dkr.ecr.us-east-1.amazonaws.com/product-service:${{ github.sha }}

          
         
