apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-app
  labels:
    app: product-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: product-app
    spec:
      containers:
        - name: product-app-service
          image: yousef2005/product-service:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: product-secret
            - configMapRef:
                name: product-config
          resources:
            requests:
              cpu: "200m"
              memory: "200Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3