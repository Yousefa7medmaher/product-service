# Headless Service
apiVersion: v1
kind: Service
metadata:
  name: mongo-products
spec:
  selector:
    app: mongo-app
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP

---

# StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-db-app
  labels:
    app: mongo-db-app
spec:
  serviceName: headless-mongoforproductservice
  replicas: 1
  selector:
    matchLabels:
      app: mongo-app
  template:
    metadata:
      name: mongo-app
      labels:
        app: mongo-app
    spec:
      containers:
        - name: mongo-db-app
          image: mongo:latest
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD

  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
